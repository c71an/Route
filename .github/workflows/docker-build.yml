name: Build and Publish Minimal RSSHub Docker Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'routes/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/**'
  schedule:
    # 自动每周一定时拉取上游 RSSHub 最新更新并编译
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream RSSHub branch/tag/commit to build from'
        required: true
        default: 'master'
      push_image:
        description: 'Push image to container registry'
        required: true
        type: boolean
        default: true

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 compilation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'workflow_dispatch' || inputs.push_image == true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (Optional)
        if: (github.event_name != 'workflow_dispatch' || inputs.push_image == true) && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME && format('{0}/rsshub', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,format=short,prefix=sha-
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Build and push Multi-Arch Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RSSHUB_REF=${{ inputs.upstream_ref || 'master' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image Inspection & Summary
        if: always()
        run: |
          echo "### 🚀 Minimal RSSHub Image Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Architectures:** \`linux/amd64\` (Windows) & \`linux/arm64\` (S905D Debian)" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tags:** \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Upstream Ref:** \`${{ inputs.upstream_ref || 'master' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Custom Routes Included:**" >> $GITHUB_STEP_SUMMARY
          echo "  - 7kid" >> $GITHUB_STEP_SUMMARY
          echo "  - chinacdc" >> $GITHUB_STEP_SUMMARY
          echo "  - gov" >> $GITHUB_STEP_SUMMARY
          echo "  - komatsu" >> $GITHUB_STEP_SUMMARY
          echo "  - pcb" >> $GITHUB_STEP_SUMMARY
          echo "  - ssm" >> $GITHUB_STEP_SUMMARY
          echo "  - stats" >> $GITHUB_STEP_SUMMARY
          echo "  - weibo" >> $GITHUB_STEP_SUMMARY
          echo "  - zaixs" >> $GITHUB_STEP_SUMMARY
